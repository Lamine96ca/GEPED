{# Choix de la session (pages de l'espace enseignant) #}
<form method="get" class="d-flex gap-2">
  <select name="session" class="form-select" style="height:38px;width:auto" onchange="this.form.submit()" aria-label="Session">
    {% for s in sessions %}<option value="{{ s.pk }}"{% if session and s.pk == session.pk %} selected{% endif %}>{{ s.annee }}{% if s.en_cours %} (en cours){% endif %}</option>{% endfor %}
  </select>
</form>
